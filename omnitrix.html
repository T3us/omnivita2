<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniVita // Prototipo do Cael</title>
  <link rel="stylesheet" href="assets/css/omnitrix.css?v=7" />
  <link rel="icon" href="assets/Gemini_Generated_Image_rvnvryrvnvryrvnv.png?v=1" type="image/png" />
</head>
<body class="state-closed">
  <main class="ov-app" data-omnivita-app>
    <section class="ov-scene" aria-label="Prototipo visual do OmniVita">
      <button class="ov-device" type="button" data-action="toggle" aria-label="Abrir OmniVita">
        <span class="ov-cylinder">
          <span class="ov-cap left"></span>
          <span class="ov-cap right"></span>
          <span class="ov-star star-a"></span>
          <span class="ov-star star-b"></span>
          <span class="ov-star star-c"></span>
          <span class="ov-mark mark-a"></span>
          <span class="ov-mark mark-b"></span>
          <span class="ov-core">
            <span class="ov-core-ring"></span>
            <span class="ov-core-hole"></span>
          </span>
        </span>
      </button>

      <div class="ov-vortex" aria-live="polite">
        <span class="ov-vortex-layer layer-a"></span>
        <span class="ov-vortex-layer layer-b"></span>
        <span class="ov-vortex-layer layer-c"></span>
        <span class="ov-vortex-hole"></span>
        <div class="ov-forms" data-form-list></div>
      </div>

      <div class="ov-controls" aria-label="Controles do prototipo">
        <button type="button" data-action="previous" aria-label="Forma anterior">↑</button>
        <button type="button" data-action="main" aria-label="Acao principal">●</button>
        <button type="button" data-action="next" aria-label="Proxima forma">↓</button>
      </div>

      <div class="ov-status" data-status-label>OmniVita em espera</div>
    </section>
  </main>

  <script src="assets/js/omnitrix-prototype.js?v=7"></script>
</body>
</html>
